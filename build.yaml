# Temporary diagnostic build: right half with USB logging (connect via USB, read the COM port).
include:
  - board: seeeduino_xiao_ble
    shield: totem_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_ZMK_LOG_LEVEL_DBG=y
    artifact-name: totem_right_DEBUG_usb_logging
