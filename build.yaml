# Temporary diagnostic builds for the right half (standalone USB keyboard + USB logging).
include:
  # Normal diode direction (col2row), standalone USB, with log.
  - board: seeeduino_xiao_ble
    shield: totem_right
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_USB=y -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_ZMK_KEYBOARD_NAME="\"TOTEM-R-COL2ROW\""
    artifact-name: totem_right_TEST_col2row_usb_log
  # Reversed diode direction (row2col), standalone USB, with log.
  - board: seeeduino_xiao_ble
    shield: totem_right_row2col
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT=n -DCONFIG_ZMK_USB=y -DCONFIG_ZMK_USB_LOGGING=y -DCONFIG_ZMK_LOG_LEVEL_DBG=y -DCONFIG_ZMK_KEYBOARD_NAME="\"TOTEM-R-ROW2COL\""
    artifact-name: totem_right_TEST_row2col_usb_log
